services:
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/state/app.db
      MODEL_PATH: /app/backend/saved_models/active_model.joblib
      REPORT_DIR: /app/backend/reports
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes:
      - ./backend/saved_models:/app/backend/saved_models
      - ./backend/reports:/app/backend/reports
      - backend_db:/app/state
      - ./data:/app/data
  frontend:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      BACKEND_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    depends_on: [backend]
volumes:
  frontend_node_modules:
  backend_db:
